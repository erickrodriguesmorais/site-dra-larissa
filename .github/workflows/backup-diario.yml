name: Backup diário para Google Drive

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest

    steps:
      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependência
        run: pip install requests

      - name: Criar pastas e enviar backups
        env:
          GDRIVE_CLIENT_ID: ${{ secrets.GDRIVE_CLIENT_ID }}
          GDRIVE_CLIENT_SECRET: ${{ secrets.GDRIVE_CLIENT_SECRET }}
          GDRIVE_REFRESH_TOKEN: ${{ secrets.GDRIVE_REFRESH_TOKEN }}
        run: |
          python - <<'PY'
          import os
          import json
          import requests
          from datetime import datetime, timedelta, timezone

          BASE = "https://www.googleapis.com/drive/v3"
          UPLOAD = "https://www.googleapis.com/upload/drive/v3/files"
          OWNER = "erickrodriguesmorais"

          REPOS = [
              "site-dra-larissa",
              "links-dra-larissa",
              "crm-dra-larissa",
          ]

          HEADERS_JSON = {
              "Content-Type": "application/json; charset=UTF-8"
          }

          def check(response):
              if not response.ok:
                  raise RuntimeError(
                      f"Erro HTTP {response.status_code}: "
                      f"{response.text[:1000]}"
                  )
              return response

          # Renovar o token de acesso do Google Drive.
          token_response = check(requests.post(
              "https://oauth2.googleapis.com/token",
              data={
                  "client_id": os.environ["GDRIVE_CLIENT_ID"],
                  "client_secret": os.environ["GDRIVE_CLIENT_SECRET"],
                  "refresh_token": os.environ["GDRIVE_REFRESH_TOKEN"],
                  "grant_type": "refresh_token",
              },
              timeout=30,
          ))

          access_token = token_response.json()["access_token"]
          headers = {"Authorization": f"Bearer {access_token}"}

          def list_files(query, fields="files(id,name,mimeType,createdTime,parents)"):
              response = check(requests.get(
                  f"{BASE}/files",
                  headers=headers,
                  params={
                      "q": query,
                      "fields": fields,
                      "pageSize": 1000,
                  },
                  timeout=30,
              ))
              return response.json().get("files", [])

          def escape_query(value):
              return value.replace("\\", "\\\\").replace("'", "\\'")

          # Localizar a pasta principal.
          folders = list_files(
              "name = 'BACKUP_GITHUB' "
              "and mimeType = 'application/vnd.google-apps.folder' "
              "and trashed = false",
              "files(id,name)",
          )

          if folders:
              main_folder_id = folders[0]["id"]
          else:
              response = check(requests.post(
                  f"{BASE}/files",
                  headers={
                      **headers,
                      "Content-Type": "application/json",
                  },
                  json={
                      "name": "BACKUP_GITHUB",
                      "mimeType": "application/vnd.google-apps.folder",
                  },
                  timeout=30,
              ))
              main_folder_id = response.json()["id"]

          # Usar a data de Brasília para nomear a pasta diária.
          from zoneinfo import ZoneInfo

          now_local = datetime.now(ZoneInfo("America/Sao_Paulo"))
          today = now_local.strftime("%d-%m-%Y")

          print(f"Pasta de backup do dia: {today}")

          # Localizar ou criar a pasta do dia.
          safe_today = escape_query(today)

          daily_folders = list_files(
              f"name = '{safe_today}' "
              "and mimeType = 'application/vnd.google-apps.folder' "
              f"and '{main_folder_id}' in parents "
              "and trashed = false",
              "files(id,name)",
          )

          if daily_folders:
              daily_folder_id = daily_folders[0]["id"]
              print(f"Usando pasta existente: {today}")
          else:
              response = check(requests.post(
                  f"{BASE}/files",
                  headers={
                      **headers,
                      "Content-Type": "application/json",
                  },
                  json={
                      "name": today,
                      "mimeType": "application/vnd.google-apps.folder",
                      "parents": [main_folder_id],
                  },
                  timeout=30,
              ))
              daily_folder_id = response.json()["id"]
              print(f"Pasta criada: {today}")

          # Criar ou substituir o ZIP de cada repositório.
          for repo in REPOS:
              print(f"Baixando repositório: {repo}")

              download = check(requests.get(
                  f"https://api.github.com/repos/{OWNER}/{repo}/zipball",
                  headers={"Accept": "application/vnd.github+json"},
                  timeout=120,
              ))

              filename = f"{repo}.zip"
              safe_filename = escape_query(filename)

              existing = list_files(
                  f"name = '{safe_filename}' "
                  f"and '{daily_folder_id}' in parents "
                  "and trashed = false",
                  "files(id,name)",
              )

              boundary = "backup_github_boundary"
              metadata = {
                  "name": filename,
                  "description": (
                      f"Backup de {repo} em {today}"
                  ),
                  "parents": [daily_folder_id],
              }

              body = (
                  f"--{boundary}\r\n"
                  "Content-Type: application/json; charset=UTF-8\r\n\r\n"
                  f"{json.dumps(metadata)}\r\n"
                  f"--{boundary}\r\n"
                  "Content-Type: application/zip\r\n"
                  "Content-Transfer-Encoding: binary\r\n\r\n"
              ).encode("utf-8") + download.content + (
                  f"\r\n--{boundary}--\r\n"
              ).encode("utf-8")

              if existing:
                  file_id = existing[0]["id"]

                  upload = check(requests.patch(
                      f"{UPLOAD}/{file_id}",
                      headers={
                          **headers,
                          "Content-Type": (
                              f"multipart/related; boundary={boundary}"
                          ),
                      },
                      params={
                          "uploadType": "multipart",
                          "fields": "id,name",
                      },
                      data=body,
                      timeout=180,
                  ))

                  print(f"Backup atualizado: {upload.json()['name']}")

                  # Remover eventuais duplicatas com o mesmo nome.
                  for duplicate in existing[1:]:
                      check(requests.delete(
                          f"{BASE}/files/{duplicate['id']}",
                          headers=headers,
                          timeout=30,
                      ))
                      print(f"Duplicata removida: {duplicate['name']}")

              else:
                  upload = check(requests.post(
                      UPLOAD,
                      headers={
                          **headers,
                          "Content-Type": (
                              f"multipart/related; boundary={boundary}"
                          ),
                      },
                      params={
                          "uploadType": "multipart",
                          "fields": "id,name",
                      },
                      data=body,
                      timeout=180,
                  ))

                  print(f"Backup enviado: {upload.json()['name']}")

          # Excluir pastas diárias com mais de 30 dias.
          print("Verificando pastas antigas...")

          cutoff = now_local.date() - timedelta(days=30)

          all_folders = list_files(
              f"'{main_folder_id}' in parents "
              "and mimeType = 'application/vnd.google-apps.folder' "
              "and trashed = false",
              "files(id,name,mimeType)",
          )

          for folder in all_folders:
              try:
                  folder_date = datetime.strptime(
                      folder["name"], "%d-%m-%Y"
                  ).date()
              except ValueError:
                  # Não mexer em pastas que não usam o padrão de data.
                  continue

              if folder_date < cutoff:
                  check(requests.delete(
                      f"{BASE}/files/{folder['id']}",
                      headers=headers,
                      params={"supportsAllDrives": "true"},
                      timeout=30,
                  ))
                  print(f"Pasta antiga removida: {folder['name']}")

          # Limpar ZIPs antigos que ficaram diretamente na pasta principal
          # durante os testes anteriores.
          root_zips = list_files(
              f"'{main_folder_id}' in parents "
              "and trashed = false",
              "files(id,name,createdTime,mimeType)",
          )

          for file in root_zips:
              if not file["name"].endswith(".zip"):
                  continue

              try:
                  created = datetime.fromisoformat(
                      file["createdTime"].replace("Z", "+00:00")
                  ).date()
              except (KeyError, ValueError):
                  continue

              if created < cutoff:
                  check(requests.delete(
                      f"{BASE}/files/{file['id']}",
                      headers=headers,
                      timeout=30,
                  ))
                  print(f"ZIP antigo removido: {file['name']}")

          print("Backup diário concluído com sucesso.")
          PY
