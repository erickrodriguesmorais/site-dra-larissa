name: Backup diário para Google Drive

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest

    steps:
      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependência
        run: pip install requests

      - name: Gerar e enviar backups
        env:
          GDRIVE_CLIENT_ID: ${{ secrets.GDRIVE_CLIENT_ID }}
          GDRIVE_CLIENT_SECRET: ${{ secrets.GDRIVE_CLIENT_SECRET }}
          GDRIVE_REFRESH_TOKEN: ${{ secrets.GDRIVE_REFRESH_TOKEN }}
        run: |
          python - <<'PY'
          import os
          import io
          import json
          import zipfile
          import requests
          from datetime import datetime, timedelta, timezone
          from email.utils import format_datetime

          BASE = "https://www.googleapis.com/drive/v3"
          UPLOAD = "https://www.googleapis.com/upload/drive/v3/files"
          OWNER = "erickrodriguesmorais"
          REPOS = [
              "site-dra-larissa",
              "links-dra-larissa",
              "crm-dra-larissa",
          ]

          def check(response):
              if not response.ok:
                  raise RuntimeError(
                      f"Erro HTTP {response.status_code}: "
                      f"{response.text[:1000]}"
                  )
              return response

          token_response = requests.post(
              "https://oauth2.googleapis.com/token",
              data={
                  "client_id": os.environ["GDRIVE_CLIENT_ID"],
                  "client_secret": os.environ["GDRIVE_CLIENT_SECRET"],
                  "refresh_token": os.environ["GDRIVE_REFRESH_TOKEN"],
                  "grant_type": "refresh_token",
              },
              timeout=30,
          )
          check(token_response)
          access_token = token_response.json()["access_token"]
          headers = {"Authorization": f"Bearer {access_token}"}

          def list_files(query, fields):
              response = check(requests.get(
                  f"{BASE}/files",
                  headers=headers,
                  params={
                      "q": query,
                      "fields": fields,
                      "pageSize": 1000,
                      "orderBy": "createdTime",
                  },
                  timeout=30,
              ))
              return response.json().get("files", [])

          folders = list_files(
              "name = 'BACKUP_GITHUB' and "
              "mimeType = 'application/vnd.google-apps.folder' "
              "and trashed = false",
              "files(id,name)",
          )

          if folders:
              folder_id = folders[0]["id"]
          else:
              response = check(requests.post(
                  f"{BASE}/files",
                  headers={**headers, "Content-Type": "application/json"},
                  json={
                      "name": "BACKUP_GITHUB",
                      "mimeType": "application/vnd.google-apps.folder",
                  },
                  timeout=30,
              ))
              folder_id = response.json()["id"]

          now = datetime.now(timezone.utc)
          stamp = now.strftime("%Y-%m-%d")
          boundary = "backup_github_boundary"

          for repo in REPOS:
              print(f"Baixando {repo}...")
              response = check(requests.get(
                  f"https://api.github.com/repos/{OWNER}/{repo}/zipball",
                  headers={"Accept": "application/vnd.github+json"},
                  timeout=120,
              ))

              filename = f"{repo}-{stamp}.zip"
              metadata = {
                  "name": filename,
                  "parents": [folder_id],
                  "description": f"Backup diário do GitHub: {repo}",
              }

              body = (
                  f"--{boundary}\r\n"
                  "Content-Type: application/json; charset=UTF-8\r\n\r\n"
                  f"{json.dumps(metadata)}\r\n"
                  f"--{boundary}\r\n"
                  "Content-Type: application/zip\r\n"
                  "Content-Transfer-Encoding: binary\r\n\r\n"
              ).encode() + response.content + f"\r\n--{boundary}--\r\n".encode()

              upload = check(requests.post(
                  UPLOAD,
                  headers={
                      **headers,
                      "Content-Type": f"multipart/related; boundary={boundary}",
                  },
                  params={"uploadType": "multipart", "fields": "id,name"},
                  data=body,
                  timeout=180,
              ))
              print(f"Backup enviado: {upload.json()['name']}")

          print("Limpando backups com mais de 30 dias...")
          cutoff = now - timedelta(days=30)
          old_files = list_files(
              f"'{folder_id}' in parents and trashed = false",
              "files(id,name,createdTime)",
          )

for file in old_files:
    if not file["name"].endswith(".zip"):
        continue

    created = datetime.fromisoformat(
        file["createdTime"].replace("Z", "+00:00")
    )

    if created < cutoff:
        check(requests.delete(
            f"{BASE}/files/{file['id']}",
            headers=headers,
            timeout=30,
        ))
        print(f"Removido backup antigo: {file['name']}")

print("Backup diário concluído.")
PY
